name: Docker

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  REGISTRY: ghcr.io

jobs:
  changed-dirs:
    name: Detect changed app directories
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.filter.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Get changed Dockerfile directories
        id: filter
        run: |
          CHANGED=$(git diff --name-only ${{ github.sha }}^ ${{ github.sha }})
          DIRS=()
          for path in $CHANGED; do
            case "$path" in
              */Dockerfile)
                dir=$(dirname "$path")
                if [[ ! " ${DIRS[@]} " =~ " $dir " ]]; then
                  DIRS+=("$dir")
                fi
                ;;
            esac
          done
          echo "Detected changed dirs: ${DIRS[@]}"
          if [[ ${#DIRS[@]} -eq 0 ]]; then
            echo "dirs=[]" >> $GITHUB_OUTPUT
          else
            echo "dirs=$(jq -c -n '$ARGS.positional' --args "${DIRS[@]}")" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    needs: changed-dirs
    if: ${{ needs.changed-dirs.outputs.dirs != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: ${{ fromJson(needs.changed-dirs.outputs.dirs) }}
    permissions:
      contents: write   # need write for git tag push
      packages: write
      id-token: write   # for cosign

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # <-- needed for git tag push and version from history

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker image tag
        id: taggen
        run: |
          TAG=""
          if [ -f "${{ matrix.dir }}/VERSION" ]; then
            TAG=$(cat "${{ matrix.dir }}/VERSION")
          else
            TAG=${GITHUB_SHA::7}
          fi
          IMAGE_TAG="${TAG}"
          IMAGE_NAME="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.dir }}"
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.dir }}
          file: ${{ matrix.dir }}/Dockerfile
          push: true
          tags: |
            ${{ steps.taggen.outputs.image_name }}:${{ steps.taggen.outputs.image_tag }}
            ${{ steps.taggen.outputs.image_name }}:latest

      - name: Create and push git tag for app
        if: github.ref == 'refs/heads/master'
        env:
          GIT_TAG: ${{ matrix.dir }}-${{ steps.taggen.outputs.image_tag }}
        run: |
          # Only create tag if not exist
          set -e
          if ! git tag | grep -qx "$GIT_TAG"; then
            git config user.email "actions@github.com"
            git config user.name "GitHub Actions"
            git tag "$GIT_TAG"
            # Push tag back to origin
            git push origin "$GIT_TAG"
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign the published Docker image
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign ${{ steps.taggen.outputs.image_name }}@${{ steps.build-and-push.outputs.digest }}
